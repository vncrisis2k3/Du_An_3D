<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2D sang 3D Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
  <main class="page">
    <section class="workspace">
      <div class="intro">
        <h1>2D sang 3D</h1>
        <p class="subtitle">Upload ảnh JPG/PNG để tạo depth map, point cloud và mesh GLB/OBJ/PLY.</p>
      </div>

      <form id="uploadForm" class="uploader">
        <div class="field">
          <label for="imageInput" class="label">Ảnh đầu vào</label>
          <input id="imageInput" name="file" type="file" accept="image/png,image/jpeg" required />
        </div>
        <div class="field">
          <label for="modeSelect" class="label">Chế độ</label>
          <select id="modeSelect" name="mode">
            <option value="triposr">360 object đẹp (TripoSR)</option>
            <option value="depth">Depth nhanh cho cảnh/relief</option>
          </select>
        </div>
        <button id="submitBtn" type="submit">Tạo mô hình 3D</button>
      </form>

      <div id="status" class="status">Sẵn sàng.</div>

      <div class="preview-grid">
        <figure class="image-preview">
          <img id="sourcePreview" alt="Ảnh đã chọn" />
        </figure>
        <model-viewer
          id="viewer"
          camera-controls
          auto-rotate
          shadow-intensity="1"
          interaction-prompt="auto"
          style="width: 100%; height: 420px;">
        </model-viewer>
      </div>

      <div id="downloadLinks" class="downloads"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
